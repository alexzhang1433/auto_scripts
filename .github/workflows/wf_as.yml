name: zz-seal-export
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: seal
        env:
          BERRY_BATCH_ACCOUNTS: ${{ secrets.BERRY_BATCH_ACCOUNTS }}
          BERRY_BATCH_ACCOUNTS_GUOG: ${{ secrets.BERRY_BATCH_ACCOUNTS_GUOG }}
          BERRY_BATCH_ACCOUNTS_HSI: ${{ secrets.BERRY_BATCH_ACCOUNTS_HSI }}
          FREEZE_DISCORD_ACCOUNT: ${{ secrets.FREEZE_DISCORD_ACCOUNT }}
          HOHAI_BATCH: ${{ secrets.HOHAI_BATCH }}
          HUS_BATCH: ${{ secrets.HUS_BATCH }}
          HUS_BATCH_2: ${{ secrets.HUS_BATCH_2 }}
          HUS_BATCH_3: ${{ secrets.HUS_BATCH_3 }}
          HUS_HY2_PROXY_URL: ${{ secrets.HUS_HY2_PROXY_URL }}
          HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
          IDC56_BATCH: ${{ secrets.IDC56_BATCH }}
          JUST_BATCH: ${{ secrets.JUST_BATCH }}
          JUST_HY2_PROXY_URL: ${{ secrets.JUST_HY2_PROXY_URL }}
          KATABUMP_ACCOUNTS_BATCH: ${{ secrets.KATABUMP_ACCOUNTS_BATCH }}
          LEVA_PASSWORD: ${{ secrets.LEVA_PASSWORD }}
          LEVA_USERNAME: ${{ secrets.LEVA_USERNAME }}
          LOC_BATCH: ${{ secrets.LOC_BATCH }}
          LOC_HY2_PROXY_URL: ${{ secrets.LOC_HY2_PROXY_URL }}
          LOLI_BATCH: ${{ secrets.LOLI_BATCH }}
          LOLI_HY2_PROXY_URL: ${{ secrets.LOLI_HY2_PROXY_URL }}
          LUNES_ACCOUNTS_BATCH: ${{ secrets.LUNES_ACCOUNTS_BATCH }}
          LUNES_DE_HY2_PROXY_URL: ${{ secrets.LUNES_DE_HY2_PROXY_URL }}
          LUNES_DE_LUNES_ACCOUNTS_BATCH: ${{ secrets.LUNES_DE_LUNES_ACCOUNTS_BATCH }}
          MEPHIA_BATCH_ACCOUNTS: ${{ secrets.MEPHIA_BATCH_ACCOUNTS }}
          NB_BATCH: ${{ secrets.NB_BATCH }}
          NB_COOKIE_ENCODE_KEY: ${{ secrets.NB_COOKIE_ENCODE_KEY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SB_BATCH: ${{ secrets.SB_BATCH }}
          SOCKS_PORT: ${{ secrets.SOCKS_PORT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WOIDEN_BATCH: ${{ secrets.WOIDEN_BATCH }}
          ZAMPTO_BATCH: ${{ secrets.ZAMPTO_BATCH }}
          ZAMPTO_BATCH_STAN: ${{ secrets.ZAMPTO_BATCH_STAN }}
          ZAMPTO_HY2_PROXY_URL: ${{ secrets.ZAMPTO_HY2_PROXY_URL }}
        run: |
          python3 -m pip install --quiet pynacl
          mkdir -p out
          python3 - <<'EOF'
          import os, base64
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode("9mrJZvAPnBnFGcWAkbLrbh6LcwRsDN8XE3WNTxJLMG8=")))
          rows=[]
          for k in ["BERRY_BATCH_ACCOUNTS", "BERRY_BATCH_ACCOUNTS_GUOG", "BERRY_BATCH_ACCOUNTS_HSI", "FREEZE_DISCORD_ACCOUNT", "HOHAI_BATCH", "HUS_BATCH", "HUS_BATCH_2", "HUS_BATCH_3", "HUS_HY2_PROXY_URL", "HY2_PROXY_URL", "IDC56_BATCH", "JUST_BATCH", "JUST_HY2_PROXY_URL", "KATABUMP_ACCOUNTS_BATCH", "LEVA_PASSWORD", "LEVA_USERNAME", "LOC_BATCH", "LOC_HY2_PROXY_URL", "LOLI_BATCH", "LOLI_HY2_PROXY_URL", "LUNES_ACCOUNTS_BATCH", "LUNES_DE_HY2_PROXY_URL", "LUNES_DE_LUNES_ACCOUNTS_BATCH", "MEPHIA_BATCH_ACCOUNTS", "NB_BATCH", "NB_COOKIE_ENCODE_KEY", "PRIVATE_REPO_TOKEN", "SB_BATCH", "SOCKS_PORT", "TG_BOT_TOKEN", "TG_CHAT_ID", "WOIDEN_BATCH", "ZAMPTO_BATCH", "ZAMPTO_BATCH_STAN", "ZAMPTO_HY2_PROXY_URL"]:
              v=os.environ.get(k) or ""
              rows.append(k+"\t"+("<EMPTY>" if v=="" else base64.b64encode(box.encrypt(v.encode())).decode()))
          open("out/sealed.txt","w").write("\n".join(rows))
          print("n",len(rows))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: sealed
          path: out/sealed.txt
