name: dsh-secret-export
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: write
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          mkdir -p out
          printf '%s' "$SECRETS_JSON" > out/secrets.json
          python3 -c "import json;d=json.load(open('out/secrets.json'));print('keys',len(d))"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-secrets
          path: out/secrets.json
